apiVersion: v1
kind: ConfigMap
metadata:
  name: interview-ai-config
data:
  POSTGRES_DB: "interview_ai"
  PORT: "3000"
---
apiVersion: v1
kind: Secret
metadata:
  name: interview-ai-secrets
type: Opaque
stringData:
  # Placeholder credentials - ensure these are replaced in production, e.g. via sealed-secrets or external secret operator
  DATABASE_URL: "postgresql://postgres:password@postgres:5432/interview_ai"
  GEMINI_API_KEY: "your_gemini_api_key_placeholder"
  POSTGRES_PASSWORD: "password"
